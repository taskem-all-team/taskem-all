[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taskem-all"
version = "0.1.0"
description = "Python desktop task manager for Linux and Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.7,<7", "SQLAlchemy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.gui-scripts]
taskem-all = "taskem_all.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
